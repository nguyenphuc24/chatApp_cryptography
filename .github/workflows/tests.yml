name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/client.py --cert pki/team1/client.crt --key pki/team1/client.key --mssv 2412716 2412760
      - run: python src/client.py --cert pki/team2/client.crt --key pki/team2/client.key --mssv 2312716 2312760
      - run: python -m unittest discover -s tests -v
